<!DOCTYPE html>
<html lang="en">

<title>IBUISC'26 · Youth at the Crossroads</title>

<style>
  :root{--red:#d8002e;--deep:#a3001f;
    --bg:#f6f4f0;--bg2:#ffffff;--ink:#1f2026;--soft:#45464d;--line:rgba(31,32,38,.13);--chip:rgba(31,32,38,.05);--card:#ffffff;
    --road:#e3ded5;--lane:#ffffff;--nav:rgba(246,244,240,.86);--red-text:#d8002e;--logo-digits:#231f20}
  :root[data-palette=mist]{--bg:#eef1f5;--bg2:#ffffff;--ink:#1b2230;--soft:#414a5a;--line:rgba(27,34,48,.13);--chip:rgba(27,34,48,.05);--card:#ffffff;
    --road:#dbe1e9;--lane:#ffffff;--nav:rgba(238,241,245,.86)}
  :root[data-palette=slate]{--bg:#30353f;--bg2:#3a404b;--ink:#f2f0eb;--soft:rgba(242,240,235,.84);--line:rgba(242,240,235,.16);--chip:rgba(242,240,235,.08);--card:rgba(242,240,235,.06);
    --road:#424855;--lane:rgba(242,240,235,.45);--nav:rgba(48,53,63,.86);--red-text:#ff7a93;--logo-digits:#f2f0eb}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  html,body{overflow-x:clip}
  body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--red);outline-offset:3px}
  .btn{display:inline-block;background:var(--red);color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15.5px}
  .btn:hover{background:var(--deep)}

  /* navigation: transparent over the hero, solid once you scroll; the section being read is marked */
  nav{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 48px;border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
  nav.solid{background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
  .brand{color:var(--logo-digits)}
  .logo{display:block;height:42px;width:auto}
  .brand small{display:block;font-size:12.5px;font-weight:600;line-height:1.3;color:var(--soft);padding-left:12px;border-left:1px solid var(--line)}
  nav .links{display:flex;gap:2px}
  nav .links a{text-decoration:none;color:var(--ink);font-weight:600;font-size:15.5px;padding:9px 14px;border-radius:999px;display:flex;align-items:center;gap:7px}
  nav .links a:hover{color:var(--red-text)}
  nav .links a.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
  nav .links .m-only{display:none}
  nav>.btn{margin-left:10px}
  .menu{display:none;font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer}
  nav .bar{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--red);transform:scaleX(0);transform-origin:left;will-change:transform}
  @media (max-width:980px){
    nav{padding:12px 20px}
    nav.solid{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
    nav>.btn{display:none}
    .menu{display:block}
    nav .links{display:none;position:absolute;top:calc(100% + 6px);left:12px;right:12px;flex-direction:column;gap:2px;padding:8px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);box-shadow:0 20px 40px -20px rgba(20,10,15,.4)}
    nav.open .links{display:flex}
    nav .links a{padding:13px 16px;font-size:17px}
    nav .links .m-only{display:flex;background:var(--red);color:#fff;justify-content:center;margin-top:4px}
  }
  /* hero: three roads meet at a junction in Skopje */
  .intro{position:relative;overflow:hidden;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 48px 56px}
  .intro>*:not(.roads){position:relative;z-index:1}
  .intro .lbl{font-size:15px;font-weight:600;color:var(--red-text)}
  .intro h1{font-size:14vw;font-weight:900;letter-spacing:-.06em;line-height:.8;margin-top:16px}
  .intro h1 span{color:var(--red)}
  .intro .hint{margin-top:30px;display:flex;justify-content:space-between;gap:20px;font-size:17px;font-weight:600;color:var(--soft)}
  .roads{position:absolute;inset:0;width:100%;height:100%}
  .road path{fill:none;stroke:var(--road);stroke-width:58;stroke-linecap:round;stroke-dasharray:1800;stroke-dashoffset:1800;animation:draw 1.6s cubic-bezier(.5,0,.2,1) forwards}
  .road path.lane{stroke:var(--lane);stroke-width:3;stroke-dasharray:18 16;stroke-dashoffset:0;opacity:0;animation:fade .6s 1.3s forwards}
  .road:nth-child(2) path{animation-delay:.2s}.road:nth-child(3) path{animation-delay:.4s}
  .sign{opacity:0;animation:fade .5s var(--d) forwards}
  .sign rect{fill:var(--red)}
  .sign text{fill:#fff;font:600 17px "Inter Tight";text-anchor:middle}
  .junction{opacity:0;animation:fade .5s 1.5s forwards}
  .junction circle{fill:var(--red);stroke:var(--bg);stroke-width:5}
  .junction .pulse{fill:none;stroke:var(--red);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s 1.8s ease-out infinite}
  .junction text{fill:var(--ink);font:600 18px "Inter Tight";text-anchor:middle}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  @keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
  @media (max-width:760px){.sign{display:none}.intro{padding:0 20px 40px}.intro h1{font-size:15vw}.intro .hint{flex-direction:column;gap:4px}}

  /* sections: numbered chapters with outlined numbers and titles that rise in (from Cinematic Chapters) */
  .s-root{--s-bg:var(--bg);--s-bg2:var(--bg2);--s-fg:var(--ink);--s-soft:var(--soft);--s-line:var(--line);--s-chip:var(--chip);--s-card:var(--card);
    --s-accent:var(--red);--s-display:"Inter Tight",sans-serif;--s-h2:clamp(52px,8vw,132px);--s-h2ls:-.06em;--s-r:16px}
  .s-root .s-n{display:block;position:absolute;right:-10px;top:-70px;font-size:clamp(150px,24vw,360px);font-weight:900;line-height:.8;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:2px var(--line);pointer-events:none}
  .s-root .s-head p{margin-left:0;flex-basis:100%}
  .s-root .s-head h2{overflow:hidden;padding-bottom:.08em}
  .s-root .s-head h2.in{animation:up 1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes up{from{transform:translateY(60%);opacity:0}}
  .s-red,.s-sec-submit{background:var(--red)!important;--s-fg:#fff;--s-soft:rgba(255,255,255,.92);--s-line:rgba(255,255,255,.3);--s-card:rgba(0,0,0,.12);--s-chip:rgba(0,0,0,.14);--s-accent:#fff;--s-accent-fg:var(--red);color:#fff}
  .s-red .s-n,.s-sec-submit .s-n{-webkit-text-stroke-color:rgba(255,255,255,.28)}

  /* key dates: the road continues downwards, one stop per milestone */
  .route{list-style:none;position:relative;padding-left:96px}
  .route .road{position:absolute;left:22px;top:6px;bottom:6px;width:44px;border-radius:22px;background:var(--road);overflow:hidden}
  /* everything that moves with the scroll uses transforms only, so phones can keep it on the GPU */
  .route .lane{position:absolute;left:50%;top:-34px;bottom:0;width:3px;margin-left:-1.5px;background:repeating-linear-gradient(var(--lane) 0 18px,transparent 18px 34px);z-index:1;will-change:transform}
  .route .road i{position:absolute;left:0;right:0;top:0;height:100%;background:var(--red);transform:scaleY(0);transform-origin:top;will-change:transform}
  /* the marker drives down the road with the scroll; stops light up once it has passed them */
  .puck{position:absolute;left:44px;top:6px;will-change:transform;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--red);border:5px solid #fff;box-shadow:0 6px 18px -4px rgba(216,0,46,.7);z-index:2;pointer-events:none}
  .puck::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--red);animation:ring 1.8s ease-out infinite}
  @keyframes ring{to{transform:scale(2.4);opacity:0}}
  .stop .when,.stop>div:nth-child(2),.stop .cd{transition:opacity .4s}
  .route.live .stop:not(.past) .when,.route.live .stop:not(.past)>div:nth-child(2),.route.live .stop:not(.past) .cd{opacity:.38}
  .stop{position:relative;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) auto;gap:12px 40px;align-items:start;padding:34px 0;border-top:1px solid var(--line)}
  .stop:first-of-type{border-top:0}
  .stop::before{content:"";position:absolute;left:-63px;top:40px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:4px solid var(--red);z-index:1;transition:transform .3s,background .3s}
  .stop.past::before{background:#fff;transform:scale(1.15)}
  .stop .btn{color:#fff}
  .when{font-size:clamp(26px,2.6vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
  .when small{display:block;font-size:15px;font-weight:600;letter-spacing:0;color:var(--red-text);margin-bottom:6px}
  .stop h3{font-size:clamp(22px,2vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .stop p{color:var(--soft);margin-top:8px;max-width:52ch;font-size:17.5px;line-height:1.5}
  .stop .btn{margin-top:16px}
  .status{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--red);color:#fff}
  .status.closed{background:var(--chip);color:var(--soft)}
  .cd{display:flex;gap:8px;font-variant-numeric:tabular-nums}
  .cd span{min-width:74px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:30px;font-weight:800;line-height:1}
  .cd small{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-top:6px}
  .stop[data-k=abstract] .cd span{color:var(--red)}
  @media (max-width:1060px){.stop{grid-template-columns:minmax(0,1fr)}.cd{margin-top:6px}}
  @media (max-width:600px){.route{padding-left:52px}.route .road{left:6px;width:26px}.puck{left:19px;width:24px;height:24px;margin:-12px 0 0 -12px;border-width:4px}.stop::before{left:-42px;top:38px;width:18px;height:18px}.cd span{min-width:0;flex:1;font-size:22px;padding:10px 2px}}

  /* topics: big faculty names in white on red (from Cinematic Chapters); one opens at a time */
  .fac{position:relative;z-index:1;margin-top:-6px}
  .fac>p{font-size:15px;font-weight:700;color:#fbdde3;margin-bottom:10px}
  .fac button{all:unset;box-sizing:border-box;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 22px;width:100%;cursor:pointer;padding:2px 0;color:#fff}
  .fac .nm{font-size:clamp(40px,6.4vw,96px);font-weight:900;letter-spacing:-.055em;line-height:1.02;color:#f2a3b3;transition:color .3s}
  .fac small{font-size:16px;font-weight:700;color:#f7c3cd;transition:color .3s}
  .fac button:hover .nm,.fac button:focus-visible .nm,.fac [aria-expanded=true] .nm{color:#fff}
  .fac button:hover small,.fac [aria-expanded=true] small{color:#fff}
  .fac button:focus-visible{outline:3px solid #fff;outline-offset:4px}
  .fac ol{list-style:none;counter-reset:t;columns:2 340px;column-gap:40px;margin:10px 0 36px}
  .fac li{counter-increment:t;break-inside:avoid;display:grid;grid-template-columns:42px 1fr;padding:12px 0;border-top:1px solid rgba(255,255,255,.3);font-size:17.5px;font-weight:500;line-height:1.4;color:#fff}
  .fac li::before{content:counter(t,decimal-leading-zero);font-weight:800;font-size:14px;padding-top:3px}
  .ticker{margin-top:80px;margin-bottom:-110px;background:var(--ink);color:var(--bg);white-space:nowrap;overflow:hidden;padding:16px 0;font-size:15px;font-weight:600}
  .ticker span{display:inline-block;animation:mq 40s linear infinite}
  @keyframes mq{to{transform:translateX(-50%)}}
  @media (max-width:760px){.fac ol{columns:1}.fac small{font-size:14px}}

  /* palette switcher, only with ?palettes */
  .pal{position:fixed;left:16px;bottom:16px;z-index:30;display:none;gap:6px;align-items:center;padding:8px 10px;border-radius:999px;background:#fff;color:#1f2026;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);font-size:14px;font-weight:600}
  .pal.show{display:flex}
  .pal button{font:inherit;border:2px solid transparent;border-radius:999px;padding:6px 12px 6px 8px;background:#f1f0ed;cursor:pointer;display:flex;gap:6px;align-items:center}
  .pal button i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
  .pal button[aria-pressed=true]{border-color:var(--red)}
  @media (prefers-reduced-motion:reduce){.road path,.sign,.junction{animation:none;opacity:1;stroke-dashoffset:0}.road path.lane{opacity:1}.junction .pulse{display:none}.ticker span,.s-root .s-head h2.in,.puck::after{animation:none}}
</style>
</head>

  <h1>Youth at the<br><span>Crossroads.</span></h1>
  <div class="hint"><span>Artificial Intelligence, Sustainability, and the Future of Society</span><span>Abstracts until November 15</span></div>
</section>

<script>
const D = IBUISC, U = D.util, esc = U.esc, dl = k => D.deadlines.find(d => d.key === k);

// chapter 01: the road to December
const stops = [
  { when: "Start now", title: "Every big idea starts with an abstract.", text: "Up to 350 words in English, as a Word document.", extra: `<a class="btn" href="#guidelines">Read the guidelines</a>` },
  { k: "abstract", title: "Send us your abstract.", text: "Submit it on this website or by email. Submitting the abstract is your application." },
  { when: "After November 15", title: "The board reviews every application.", text: `Abstract, background and chosen topic. Accepted authors get an email from ${D.email}.` },
  { k: "congress", title: "Take the stage in Skopje.", text: "Wednesday and Thursday at International Balkan University." },
  { k: "fullpaper", title: "Publish with an ISBN.", text: "After the congress, accepted authors send the full paper for the proceedings." }
];
const dates = n => `<section class="s-sec s-sec-deadlines" id="deadlines"><div class="s-wrap">
  <div class="s-head"><span class="s-n" aria-hidden="true">${n}</span><h2>Key dates</h2><p>From your first idea to the proceedings, counting down live.</p></div>
  <ol class="route" id="route"><span class="road" aria-hidden="true"><i id="fill"></i><b class="lane" id="lane"></b></span><span class="puck" id="puck" aria-hidden="true"></span>${stops.map(s => {
    const d = s.k && dl(s.k);
    return `<li class="stop"${s.k ? ` data-k="${s.k}"` : ""}><div class="when">${d ? `<small>${d.label}</small>${d.display}` : s.when}</div>
      <div><h3>${s.title}</h3><p>${s.text}</p>${s.k === "abstract" ? `<span class="status" id="abState">Open now</span>` : ""}${s.extra || ""}</div>${d ? `<div class="cd" data-k="${s.k}"></div>` : ""}</li>`;
  }).join("")}</ol></div></section>`;

// chapter 03: faculties in large type; each opens its full list of topics
const topics = n => `<section class="s-sec s-red" id="topics"><div class="s-wrap">
  <div class="s-head"><span class="s-n" aria-hidden="true">${n}</span><h2>Topics</h2><p>${U.topicCount()} topics from ${D.faculties.length} faculties. Choose a faculty to read all of its topics.</p></div>
  <div class="fac" id="facs"><p>Faculties</p>${D.faculties.map((f, i) => `<div><button type="button" aria-expanded="${i === 0}" aria-controls="fac${i}"><span class="nm">${f.short}</span><small>${f.topics.length} topics</small></button>
    <ol id="fac${i}"${i ? " hidden" : ""}>${f.topics.map(t => `<li>${esc(t)}</li>`).join("")}</ol></div>`).join("")}</div></div>
  <div class="ticker" aria-hidden="true"><span>${(D.themeShort.concat(D.faculties.map(f => f.name)).join("  ·  ") + "  ·  ").repeat(2)}</span></div></section>`;

IBUISC.site(document.getElementById("site"), { sections: { deadlines: dates, topics } });

document.getElementById("facs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const open = b.getAttribute("aria-expanded") !== "true";
  document.querySelectorAll("#facs button").forEach(x => { x.setAttribute("aria-expanded", x === b && open); document.getElementById(x.getAttribute("aria-controls")).hidden = !(x === b && open); });
  measure(); onScroll();
});

// live countdowns
function tick() {
  document.querySelectorAll(".cd").forEach(el => {
    const c = U.countdown(dl(el.dataset.k).date);
    el.innerHTML = c.done ? "" : [[c.d, "days"], [U.pad(c.h), "hrs"], [U.pad(c.m), "min"], [U.pad(c.s), "sec"]].map(([v, l]) => `<span>${v}<small>${l}</small></span>`).join("");
  });
  if (U.countdown(dl("abstract").date).done) { const s = document.getElementById("abState"); s.textContent = "Closed"; s.classList.add("closed"); }
}
tick(); setInterval(tick, 1000);

// on narrow screens frame the junction instead of the whole map
const fitRoads = () => document.getElementById("roads").setAttribute("viewBox", innerWidth < 760 ? "800 40 480 820" : "0 0 1440 900");
fitRoads(); addEventListener("resize", fitRoads);

// reading progress under the navigation, and the red line along the key-dates road
const nav = document.getElementById("nav"), bar = document.getElementById("bar"), route = document.getElementById("route"), fill = document.getElementById("fill"), puck = document.getElementById("puck");
const lane = document.getElementById("lane"), stopEls = [...route.querySelectorAll(".stop")];
route.classList.add("live");
// measure once (and on resize), then each frame only writes transforms: no layout work while scrolling
let routeTop = 0, len = 0, stopYs = [], docMax = 1, solid = null, ticking = false;
function measure() {
  routeTop = route.getBoundingClientRect().top + scrollY;
  len = route.offsetHeight - 12;
  stopYs = stopEls.map(el => el.offsetTop + 50);
  docMax = Math.max(1, document.documentElement.scrollHeight - innerHeight);
}
function frame() {
  ticking = false;
  const sy = scrollY, isSolid = sy > 40 || nav.classList.contains("open");
  if (isSolid !== solid) { solid = isSolid; nav.classList.toggle("solid", isSolid); }
  bar.style.transform = `scaleX(${Math.min(1, sy / docMax)})`;
  const y = Math.min(len, Math.max(0, sy + innerHeight * .55 - routeTop - 6)); // marker position along the road, in px
  fill.style.transform = `scaleY(${len ? y / (len + 12) : 0})`;
  puck.style.transform = `translateY(${y}px)`;
  lane.style.transform = `translateY(${(sy * .8) % 34}px)`;
  stopEls.forEach((el, i) => { const p = stopYs[i] <= 6 + y + 1; if (el._p !== p) { el._p = p; el.classList.toggle("past", p); } });
}
const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } };
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", () => { measure(); onScroll(); });
addEventListener("load", () => { measure(); onScroll(); });
document.fonts && document.fonts.ready.then(() => { measure(); onScroll(); });
measure(); frame();

// chapter titles rise into view once
const rise = new IntersectionObserver((es, o) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); o.unobserve(e.target); } }), { threshold: .4 });
document.querySelectorAll(".s-head h2").forEach(h => rise.observe(h));

// mobile menu
const menu = document.getElementById("menu");
menu.addEventListener("click", () => { const o = nav.classList.toggle("open"); onScroll(); menu.setAttribute("aria-expanded", o); menu.textContent = o ? "Close" : "Menu"; });
document.getElementById("links").addEventListener("click", e => { if (e.target.closest("a")) { nav.classList.remove("open"); menu.setAttribute("aria-expanded", false); menu.textContent = "Menu"; } });
// highlight the section being read
const navLinks = [...document.querySelectorAll("#links a:not(.m-only)")];
const spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) navLinks.forEach(a => a.classList.toggle("on", a.hash === "#" + e.target.id)); }), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll(".s-sec").forEach(sec => spy.observe(sec));

// palette review
const pal = document.getElementById("pal"), root = document.documentElement;
if (new URLSearchParams(location.search).has("palettes")) pal.classList.add("show");
const markPal = () => pal.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", (root.dataset.palette || "paper") === b.dataset.p));
pal.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { root.dataset.palette = b.dataset.p; markPal(); } });
markPal();
</script>
